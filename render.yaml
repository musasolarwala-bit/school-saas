# School Manager SaaS — Render Blueprint (FREE tier deployment)
# Apply from the Render dashboard: New → Blueprint → connect the repo.
# This creates one free Node web service + one free PostgreSQL database.
#
# FREE-TIER LIMITS (honest — see docs/school-saas-deploy.md):
# - The web service sleeps after 15 min idle (~1 min to wake).
# - The free database EXPIRES 30 days after creation (14-day grace, then
#   deleted with all data). No backups. DEMO ONLY — not production.
# - 750 free instance hours/month (roughly one always-on service).

services:
  - type: web
    name: school-saas
    runtime: node
    plan: free
    buildCommand: npm install
    # Migrations are idempotent (tracked in schema_migrations), so they
    # apply automatically before every deploy.
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      # Random value generated by Render at Blueprint apply time.
      # Never hardcode a real secret in this file.
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: school-saas-db
          property: connectionString

databases:
  - name: school-saas-db
    plan: free
    databaseName: school_saas
    user: school_saas
